<!-- templates/index.html -->
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Live Lie Detector (Heuristic)</title>
  <style>
    body { background:#0b0b0d; color:#e8e8e8; font-family: Arial, sans-serif; text-align:center; }
    .container { width:900px; margin: 30px auto; }
    .video { border-radius:8px; box-shadow:0 8px 30px rgba(0,0,0,0.6); }
    .hud { margin-top:12px; display:flex; justify-content:space-around; }
    .panel { background:#111; padding:12px 16px; border-radius:8px; width:170px; }
    .big { font-size:20px; font-weight:700; color:#ffd54f; }
    .small { font-size:13px; color:#bdbdbd; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Live Lie Detector (Prototype)</h1>
    <img src="{{ url_for('video_feed') }}" class="video" width="800" />
    <div class="hud">
      <div class="panel">
        <div class="small">Lie Probability</div>
        <div id="lie" class="big">--</div>
      </div>
      <div class="panel">
        <div class="small">Stress Index</div>
        <div id="stress" class="big">--</div>
      </div>
      <div class="panel">
        <div class="small">Blink Proxy</div>
        <div id="blink" class="big">--</div>
      </div>
      <div class="panel">
        <div class="small">Head Jitter</div>
        <div id="jitter" class="big">--</div>
      </div>
    </div>
    <p style="color:#999;margin-top:12px">Note: prototype uses heuristics. Respect privacy and use ethically.</p>
  </div>

  <script>
    async function fetchStatus(){
      try {
        const r = await fetch('/status', {cache:'no-store'});
        const j = await r.json();
        document.getElementById('lie').innerText = j.lie_probability + '%';
        document.getElementById('stress').innerText = j.stress_index + '%';
        document.getElementById('blink').innerText = j.blink_rate.toFixed(1);
        document.getElementById('jitter').innerText = j.head_jitter.toFixed(2);
      } catch (e) {
        console.log('status error', e);
      }
    }
    setInterval(fetchStatus, 600);
    fetchStatus();
  </script>
</body>
</html>
